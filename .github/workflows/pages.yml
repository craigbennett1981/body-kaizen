name: Live demo

# The demo on GitHub Pages: the dashboard's own pages over exported demo data (tools/export_static.py). Rebuilt on
# every merge to main, so it always shows the current code, and daily, so its dates end today.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: sudo apt-get update -q && pip install -r requirements.txt playwright && python -m playwright install --with-deps chromium
      - name: Export the static demo
        # The project's own demo lives at demo.bodykaizen.app (set as the Pages custom domain in the repo's
        # settings); a fork publishes to its own github.io address instead.
        env:
          BK_SITE_URL: ${{ github.repository == 'craigbennett1981/body-kaizen' && 'https://demo.bodykaizen.app/' || '' }}
        run: python tools/export_static.py _site
      - name: Click through it before publishing
        env: {BK_STATIC_SITE: _site}
        run: python -m unittest tests.test_static -v
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5