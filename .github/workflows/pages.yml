name: Live demo

# The demo on GitHub Pages: the dashboard's own pages over exported demo data (tools/export_static.py). Rebuilt on
# every merge to main, so it always shows the current code, and daily, so its dates end today.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt playwright && python -m playwright install --with-deps chromium
      - name: Export the static demo
        run: python tools/export_static.py _site
      - name: Click through it before publishing
        env: {BK_STATIC_SITE: _site}
        run: python -m unittest tests.test_static -v
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
