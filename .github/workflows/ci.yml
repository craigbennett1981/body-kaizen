name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:   # Windows and macOS users run it too: file encodings, paths, restarts
          - {os: windows-latest, python-version: "3.12"}
          - {os: macos-latest, python-version: "3.12"}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core dependency
        run: pip install pyyaml
      - name: Byte-compile app and scripts
        run: python -m compileall -q app scripts
      - name: Check the front-end script parses
        run: node --check app/static/app.js
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Tests without a UTF-8 locale (as on Windows)
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        env: {LC_ALL: C, PYTHONUTF8: "0"}
        run: python -X utf8=0 -m unittest discover -s tests

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the sdist and wheel
        run: pip install build twine && python -m build && twine check --strict dist/*
      - name: Install the wheel on its own and serve the demo
        run: |
          python -m venv /tmp/bk && /tmp/bk/bin/pip install dist/*.whl
          cd /tmp && /tmp/bk/bin/body-kaizen --version
          /tmp/bk/bin/body-kaizen demo --port 8790 & sleep 5
          curl -fsS http://127.0.0.1:8790/api/summary > /dev/null
          curl -fsS http://127.0.0.1:8790/app.js > /dev/null
          /tmp/bk/bin/body-kaizen init /tmp/bk-data && test -f /tmp/bk-data/targets.yaml
