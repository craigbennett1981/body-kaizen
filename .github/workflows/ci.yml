name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:   # Windows and macOS users run it too: file encodings, paths, restarts
          - {os: windows-latest, python-version: "3.12"}
          - {os: macos-latest, python-version: "3.12"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core dependency
        run: pip install pyyaml
      - name: Byte-compile app and scripts
        run: python -m compileall -q app scripts
      - name: Check the front-end script parses
        run: node --check app/static/app.js
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Tests without a UTF-8 locale (as on Windows)
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        env: {LC_ALL: C, PYTHONUTF8: "0"}
        run: python -X utf8=0 -m unittest discover -s tests

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the sdist and wheel
        run: pip install build twine && python -m build && twine check --strict dist/*
      - name: Install the wheel on its own and serve the demo
        run: |
          python -m venv /tmp/bk && /tmp/bk/bin/pip install dist/*.whl
          cd /tmp && /tmp/bk/bin/body-kaizen --version
          /tmp/bk/bin/body-kaizen demo --port 8790 & sleep 5
          # signed out: the sign-in page and no data; signed in through `body-kaizen open --print`: everything
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8790/api/summary)" = 401
          curl -fsS -c /tmp/jar -o /dev/null "$(/tmp/bk/bin/body-kaizen open --print --port 8790)"
          curl -fsS -b /tmp/jar http://127.0.0.1:8790/api/summary > /dev/null
          curl -fsS -b /tmp/jar http://127.0.0.1:8790/app.js > /dev/null
          /tmp/bk/bin/body-kaizen init /tmp/bk-data && test -f /tmp/bk-data/targets.yaml

  installer:
    # The one-line installers, on each system: install this commit with uv, then serve the demo and check the
    # sign-in handshake and the launcher. (No login service on a CI machine: BK_NO_SERVICE.)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install (macOS, Linux)
        if: runner.os != 'Windows'
        env: {BK_SOURCE: ., BK_NO_SERVICE: "1"}
        run: sh install/install.sh
      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env: {BK_SOURCE: ., BK_NO_SERVICE: "1"}
        run: ./install/install.ps1
      - name: Serve, sign in, check the launcher, uninstall (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          export PATH="$HOME/.local/bin:$PATH"   # where the installer put uv
          BK="$(uv tool dir --bin)/body-kaizen"
          "$BK" demo --port 8792 > /tmp/bk.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8792/ && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8792/api/summary)" = 401
          curl -fsS -c /tmp/jar -o /dev/null "$("$BK" open --print --port 8792)"
          curl -fsS -b /tmp/jar -o /dev/null http://127.0.0.1:8792/api/summary
          if [ "$RUNNER_OS" = macOS ]; then test -x "$HOME/Applications/Body Kaizen.app/Contents/MacOS/body-kaizen"; else test -f "$HOME/.local/share/applications/body-kaizen.desktop"; fi
          sh install/install.sh --uninstall
          ! command -v body-kaizen >/dev/null 2>&1 || ! test -e "$BK"
      - name: Serve, sign in, check the launcher, uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"   # where the installer put uv
          $bk = Join-Path (uv tool dir --bin).Trim() 'body-kaizen.exe'
          Start-Process $bk -ArgumentList 'demo','--port','8792' -WindowStyle Hidden
          for ($i = 0; $i -lt 60; $i++) { try { Invoke-WebRequest http://127.0.0.1:8792/ -UseBasicParsing -TimeoutSec 2 | Out-Null; break } catch { if ($_.Exception.Response) { break } }; Start-Sleep 1 }
          $r = try { Invoke-WebRequest http://127.0.0.1:8792/api/summary -UseBasicParsing; 200 } catch { [int]$_.Exception.Response.StatusCode }
          if ($r -ne 401) { throw "signed out: expected 401, got $r" }
          $url = (& $bk open --print --port 8792).Trim()
          $s = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          Invoke-WebRequest $url -WebSession $s -UseBasicParsing | Out-Null   # follows the redirect, keeping the cookie
          Invoke-WebRequest http://127.0.0.1:8792/api/summary -WebSession $s -UseBasicParsing | Out-Null
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'Body Kaizen.lnk'))) { throw 'no Start menu shortcut' }
          Get-Process body-kaizen -ErrorAction SilentlyContinue | Stop-Process -Force
          $env:BK_UNINSTALL = '1'; ./install/install.ps1
          if (Test-Path $bk) { throw 'still installed after uninstall' }

  static-demo:
    # The live demo is the real pages on exported demo data. Export it and click through every tab in a browser:
    # a route or parameter the export doesn't cover fails here, before it can break the demo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r requirements.txt playwright
          # The browser's system packages (mostly fonts) come from Ubuntu's servers. When those can't be reached, the
          # runner image already has the libraries headless Chromium needs, so install just the browser and carry on.
          timeout 90 sudo apt-get update -q || echo "apt-get update failed or timed out: using the package list as it is"
          timeout 300 python -m playwright install --with-deps chromium || python -m playwright install chromium
      - name: Export the static demo
        run: python tools/export_static.py _site
      - name: Click through it
        env: {BK_STATIC_SITE: _site}
        run: python -m unittest tests.test_static -v
