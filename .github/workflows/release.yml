name: Release

# Publishing a GitHub release (tag vX.Y.Z, matching the version in pyproject.toml) uploads that version to PyPI.
# Running this workflow by hand uploads to TestPyPI instead, for a dry run.
# Uses PyPI trusted publishing: no API token is stored here. Each index needs a trusted publisher for this
# repository, workflow release.yml and the environment named below (pypi / testpypi).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        if: github.event_name == 'release'
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "tag $GITHUB_REF_NAME doesn't match version $v in pyproject.toml"; exit 1; }
      - name: Point README links at this release, for the PyPI page
        # the ref goes in through the environment, never pasted into the script (a crafted tag name can't inject)
        env:
          REF: ${{ github.event_name == 'release' && github.ref_name || github.sha }}
        run: python tools/pypi_readme.py "$REF"
      - name: Build
        run: pip install build twine && python -m build && twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'release' && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@aef6c9b6e301dc803e1bc9133e9ce67ae9b0906b  # v1.14.3
        with:
          repository-url: ${{ github.event_name == 'release' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
