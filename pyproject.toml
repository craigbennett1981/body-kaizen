[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "body-kaizen"
version = "0.3.0"
description = "A private, local dashboard for continuous improvement of your health: food, training, recovery and healthspan in plain files you own."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Craig Bennett"}]
requires-python = ">=3.10"
keywords = ["health", "nutrition", "fitness", "dashboard", "garmin", "longevity", "self-hosted"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["pyyaml>=6.0.3,<7"]

[project.optional-dependencies]
# Garmin Connect and LibreLinkUp syncs (unofficial APIs; see docs/integrations.md)
garmin = ["garminconnect>=0.3.18,<0.4", "curl_cffi>=0.16,<0.18"]
libre = ["pylibrelinkup>=0.11.1,<0.12", "keyring>=25.7,<26"]
all = [
  "garminconnect>=0.3.18,<0.4", "curl_cffi>=0.16,<0.18",
  "pylibrelinkup>=0.11.1,<0.12", "keyring>=25.7,<26",
]

[project.scripts]
body-kaizen = "body_kaizen.cli:main"

[project.urls]
Homepage = "https://github.com/craigbennett1981/body-kaizen"
Issues = "https://github.com/craigbennett1981/body-kaizen/issues"

# The code stays where a clone runs it (app/, scripts/, foods/, demo/) and is mapped into one body_kaizen
# package when built, so the installed layout matches the repository and the same relative paths work in both.
[tool.setuptools]
packages = ["body_kaizen", "body_kaizen.app", "body_kaizen.scripts", "body_kaizen.foods", "body_kaizen.demo"]

[tool.setuptools.package-dir]
body_kaizen = "body_kaizen"
"body_kaizen.app" = "app"
"body_kaizen.scripts" = "scripts"
"body_kaizen.foods" = "foods"
"body_kaizen.demo" = "demo"

[tool.setuptools.package-data]
"body_kaizen.app" = ["static/**/*"]
"body_kaizen.foods" = ["*.yaml"]
"body_kaizen.demo" = ["**/*"]
