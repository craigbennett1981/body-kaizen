[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "body-kaizen"
version = "0.2.0"
description = "A private, local dashboard for continuous improvement of your health: food, training, recovery and healthspan in plain files you own."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0.3,<7"]

[project.optional-dependencies]
# Garmin Connect and LibreLinkUp syncs (unofficial APIs; see docs/integrations.md)
garmin = ["garminconnect>=0.3.18,<0.4", "curl_cffi>=0.16,<0.17"]
libre = ["pylibrelinkup>=0.11.1,<0.12", "keyring>=25.7,<26"]
all = [
  "garminconnect>=0.3.18,<0.4", "curl_cffi>=0.16,<0.17",
  "pylibrelinkup>=0.11.1,<0.12", "keyring>=25.7,<26",
]

[project.urls]
Homepage = "https://github.com/craigbennett1981/body-kaizen"

[tool.setuptools]
packages = []
