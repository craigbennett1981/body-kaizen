<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose what to send</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#11161c}
a{color:#8FA9F5}a:hover{color:#B7C8FA}
.sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:#3A4450;position:relative;margin:0;cursor:pointer;flex:none}
.sw:checked{background:#3CC57A}
.sw::before{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:left .15s}
.sw:checked::before{left:22px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #11161c; color: #E8EDF2; font-family: Inter, system-ui, sans-serif; padding: 60px 20px 28px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px">
<a href="Pair.dc.html" style="font-size: 16px; text-decoration: none; display: flex; align-items: center; gap: 4px; min-height: 44px"><svg width="10" height="16" viewBox="0 0 10 16" aria-hidden="true"><path d="M8 2 2 8l6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>Back</a>
<span style="font-size: 14px; color: #9AA7B4">Step 2 of 3</span>
</div>
<h1 style="margin: 0; padding: 0 4px; font-family: Archivo, sans-serif; font-weight: 800; font-size: 28px">Choose what to send</h1>
<div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; margin: 0 -4px; padding: 0 4px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="padding: 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #9AA7B4">{{g.name}}</span>
<div style="background: #1A212A; border: 1px solid #2A333E; border-radius: 14px; overflow: hidden">
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
<label style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 14px; min-height: 44px; box-sizing: border-box; border-top: {{r.line}}">
<span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px">{{r.label}}</span><span style="font-size: 12.5px; color: #9AA7B4">{{r.use}}</span></span>
<input type="checkbox" class="sw" checked="{{r.on}}" onChange="{{r.toggle}}">
</label>
</sc-for>
</div>
</div>
</sc-for>
<label style="display: flex; justify-content: space-between; align-items: center; padding: 0 8px; min-height: 44px; font-size: 15px">History to send first
<select style="background: #1A212A; color: #E8EDF2; border: 1px solid #2A333E; border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 15px"><option>Last 12 months</option><option>Last 3 months</option><option>All history</option></select></label>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding-top: 4px; border-top: 1px solid #2A333E">
<p style="margin: 0; padding: 0 8px; font-size: 13px; color: #9AA7B4">Food is never read: Body Kaizen is your food log.</p>
<a href="Health.dc.html" style="height: 54px; border-radius: 14px; background: #2F5BEA; color: #ffffff; font-size: 17px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Continue</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) {
super(p);
this.state = { off: { glucose: true } };
}
renderVals() {
const G = [
['Sleep and recovery', [['sleep', 'Sleep and stages', 'Sleep tab, bedtime experiments'], ['rhr', 'Resting heart rate', 'Readiness and recovery'], ['hrv', 'Heart rate variability', 'Readiness and recovery']]],
['Activity', [['steps', 'Steps', 'Day and Week tabs'], ['energy', 'Active and resting energy', 'Calorie balance'], ['workouts', 'Workouts', 'Training tab, merged with Hevy']]],
['Body', [['weight', 'Weight and body fat', 'Body tab'], ['bp', 'Blood pressure', 'Body and Longevity'], ['vo2', 'VO₂ max', 'Longevity'], ['glucose', 'Blood glucose', 'Only if a CGM writes to Health']]]
];
const off = this.state.off;
return { groups: G.map(([name, rows]) => ({ name, rows: rows.map(([id, label, use], i) => ({ label, use, on: !off[id], line: i ? '1px solid #2A333E' : 'none',
toggle: () => this.setState({ off: { ...off, [id]: !off[id] } }) })) })) };
}
}
</script>
</body>
</html>
