<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Status</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#11161c}
a{color:#8FA9F5}a:hover{color:#B7C8FA}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #11161c; color: #E8EDF2; font-family: Inter, system-ui, sans-serif; padding: 56px 20px 28px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px">
<h1 style="margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: 26px">Body Kaizen Sync</h1>
<a href="Settings.dc.html" aria-label="Settings" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #C7D0D9"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"></circle><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg></a>
</div>
<div style="background: #1A212A; border: 1px solid #2A333E; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 12px; height: 12px; border-radius: 50%; background: {{dot}}; flex: none"></span>
<span style="font-family: Archivo, sans-serif; font-weight: 600; font-size: 21px">{{headline}}</span>
</div>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #C7D0D9">{{detail}}</p>
<button type="button" style="height: 50px; border-radius: 14px; border: none; background: {{btnBg}}; color: {{btnInk}}; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">Sync now</button>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="padding: 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #9AA7B4">Last sent</span>
<div style="background: #1A212A; border: 1px solid #2A333E; border-radius: 14px; overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 0 14px; min-height: 44px; border-top: {{r.line}}; font-size: 15px"><span>{{r.label}}</span><span style="color: #B9C4CF">{{r.when}}</span></div>
</sc-for>
</div>
</div>
<div style="margin-top: auto; display: flex; justify-content: space-between; padding: 0 8px; font-size: 14px; color: #9AA7B4"><span>Waiting to send</span><span style="color: {{waitInk}}; font-weight: 600">{{waiting}}</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["synced","away","mac"],"default":"synced"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.props.state ?? 'synced';
const S = {
synced: { dot: '#3CC57A', headline: 'Synced 12 min ago', detail: "Craig's MacBook Air, on Home Wi-Fi.", waiting: '0', waitInk: '#B9C4CF', btnBg: '#2F5BEA', btnInk: '#FFFFFF' },
away: { dot: '#8A96A3', headline: 'Away from home', detail: "Not on the same network as Craig's MacBook Air. New data waits here and goes when you're back.", waiting: '214 items', waitInk: '#E8EDF2', btnBg: '#232B35', btnInk: '#9AA7B4' },
mac: { dot: '#F5A524', headline: "Can't reach your Mac", detail: "Craig's MacBook Air is on this Wi-Fi but isn't answering. Is it awake, with Body Kaizen running?", waiting: '38 items', waitInk: '#E8EDF2', btnBg: '#2F5BEA', btnInk: '#FFFFFF' }
}[s] || {};
const when = s === 'synced'
? ['06:16 today', '06:16 today', '06:16 today', '10:31 today', 'Yesterday 17:12', 'Mon 07:02', 'Sat 21:30']
: ['Yesterday 06:40', 'Yesterday 06:40', 'Yesterday 06:40', 'Yesterday 21:05', 'Yesterday 17:12', 'Mon 07:02', 'Sat 21:30'];
const L = ['Sleep', 'Resting heart rate', 'Heart rate variability', 'Steps', 'Workouts', 'Weight', 'Blood pressure'];
return { ...S, rows: L.map((label, i) => ({ label, when: when[i], line: i ? '1px solid #2A333E' : 'none' })) };
}
}
</script>
</body>
</html>
