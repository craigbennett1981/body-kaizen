# Starter food database, shipped with Body Kaizen. Add your own foods (or replace any of these by
# using the same key) in foods.yaml in your data folder: yours win.
# per100: macros per 100g (or 100ml for drinks). unit: macros per one unit (unit_g = its weight).
# keys: k=kcal p=protein c=carbs f=fat sf=sat fat fib=fibre (g); na=sodium caf=caffeine (mg)
# by_kcal: true  -> amount is usually given as kcal; macros scaled from per100 ratios.
# default_g: portion assumed when no weight given (confidence: low).
# conf: confidence of the nutrition values themselves (label > reference > estimate).
# liquid: true -> amounts stored and shown in ml (1 g ~ 1 ml). Weights are COOKED unless stated. Aliases are matched longest-first against the logged text.

