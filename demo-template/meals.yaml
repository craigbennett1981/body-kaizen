# Named meals: type the key (or an alias) as a log line and it expands to these items.
# "2x shake" doubles everything. Edit freely — keys are short on purpose.
b1:
  name: Oats breakfast
  aliases: [oats breakfast, breakfast oats]
  items: ["50g oats", "2 eggs", "English breakfast tea and low fat milk", "80g blueberries"]
shake:
  name: Protein shake
  aliases: [protein shake milk, milk shake]
  items: ["300ml low fat milk + 1 scoop protein powder"]
cr:
  name: Chicken, rice, broccoli
  aliases: [chicken rice bowl]
  items: ["150g rice", "150g chicken breast", "120g broccoli"]
sr:
  name: Salmon, rice, spinach
  aliases: [salmon dinner]
  items: ["130g rice", "140g salmon", "120g spinach"]
